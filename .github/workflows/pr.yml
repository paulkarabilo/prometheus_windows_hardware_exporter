name: PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Component detection
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.1

      - name: Build and package
        shell: pwsh
        run: |
          .\Scripts\ci_build.ps1 -publishDir $(Join-Path $env:GITHUB_WORKSPACE "publish") `
            -artifactsDir $(Join-Path $env:GITHUB_WORKSPACE "artifacts") `
            -version "0.0.1.${{ github.run_number }}" `
            -pack $("${{ github.event_name }}" -eq 'push' -and "${{ github.ref }}" -eq 'refs/heads/main')

      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PrometheusWindowsHardwareExporter-Artifacts
          path: |
            artifacts/PrometheusWindowsHardwareExporter.msi
            artifacts/PrometheusWindowsHardwareExporter-win-x64.zip

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}       # run this step even if previous step failed
        with:
          name: xunit-report
          path: artifacts/TestResults/*.trx
          reporter: dotnet-trx